name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Three jobs with disjoint toolchains so a flaky rustup download can only ever
# fail the jobs that genuinely need Rust:
#   rust    -> kernel gates (needs Rust)
#   web     -> presentation gates (Node only; uses the committed oc.wasm)
#   package -> two Windows exes (desktop primary + browser fallback; needs both,
#              so it runs on Windows)

jobs:
  rust:
    name: rust（fmt / clippy / test / determinism / wasm）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The @stable action ref defaults to the stable toolchain and ignores
      # rust-toolchain.toml; name the pin explicitly so CI == local rustc.
      # Bump here and in rust-toolchain.toml together.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: tests（also regenerates ts-rs types + golden fixtures）
        run: cargo test --all-features
      - name: generated artifacts must be committed
        run: |
          if ! git diff --quiet -- web/src/generated web/tests/fixtures; then
            echo "::error::Protocol types or golden fixtures are stale. Run 'cargo test' and commit web/src/generated + web/tests/fixtures."
            git --no-pager diff --stat -- web/src/generated web/tests/fixtures
            exit 1
          fi
          echo "generated TypeScript + fixtures are in sync with the Rust declarations"
      - name: determinism（3000 ticks, two runs must agree）
        run: cargo run -q -p oc-sim-cli -- 3000
      # Behavioural staleness gate. It must run *before* the release build --
      # that step overwrites web/public/oc.wasm, so the committed binary is
      # read from HEAD instead of the working tree. Byte comparison is not an
      # option: rustc embeds host-specific source paths (C:\Users\... and
      # crates\sim\src\...) in the wasm data section.
      - name: committed wasm behaves like the kernel sources
        run: |
          git show HEAD:web/public/oc.wasm > /tmp/committed-oc.wasm
          NATIVE=$(cargo run -q -p oc-sim-cli -- --idle 300)
          WASM=$(node scripts/wasm-hash.mjs /tmp/committed-oc.wasm 300)
          echo "native: $NATIVE  wasm: $WASM"
          if [ "$NATIVE" != "$WASM" ]; then
            echo "::error::Committed web/public/oc.wasm is stale (native $NATIVE vs wasm $WASM). Run 'pnpm run wasm' and commit the rebuilt binary."
            exit 1
          fi
      - name: wasm release build（also refreshes web/public/oc.wasm）
        run: node scripts/build-wasm.mjs

  web:
    name: web（typecheck / lint / test / build / guards）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json#packageManager (pnpm 11), so the lockfile
      # written locally and the one installed in CI can never disagree.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Rust here on purpose: `web/public/oc.wasm` and the generated protocol
      # types are committed. Rebuild them with `pnpm run wasm` / `cargo test`.
      - name: typecheck
        run: pnpm run typecheck
      - name: lint
        run: pnpm run lint
      - name: unit tests（protocol conformance + map/rules agreement）
        run: pnpm run test
      - name: build
        run: npx vite build
      - name: guards（file length + asset discipline）
        run: |
          node scripts/check-file-length.mjs
          node scripts/check-assets.mjs
          node scripts/strip-bom.mjs --check

  package:
    name: package（两个 Windows exe：桌面主产物 + 浏览器兜底）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json#packageManager (pnpm 11), so the lockfile
      # written locally and the one installed in CI can never disagree.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # wry/tao's build scripts (`vswhom-sys`, `embed-resource`) shell out to
      # cl.exe and need INCLUDE/LIB. windows-latest ships the MSVC toolset, but
      # the runner's default shell does not always have the developer
      # environment imported, so bring it in explicitly.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: build exe
        run: node scripts/package-exe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: APHELION-windows-exe
          path: dist-exe/*.exe
          if-no-files-found: error
