name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust（fmt / clippy / test / determinism / wasm）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: tests
        run: cargo test --all-features
      - name: determinism (3000 ticks, two runs must agree)
        run: cargo run -q -p oc-sim-cli -- 3000
      - name: wasm release build
        run: cargo build -p oc-bridge-wasm --release --target wasm32-unknown-unknown

  web:
    name: web（typecheck / lint / test / build / guards）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Protocol types, content keys and golden fixtures are generated by cargo
      # tests, so the Rust side has to run before the web checks.
      - name: codegen (ts-rs + content keys + fixtures)
        run: cargo test --all-features
      - name: build wasm
        run: node scripts/build-wasm.mjs
      - name: typecheck
        run: pnpm run typecheck
      - name: lint
        run: pnpm run lint
      - name: unit tests
        run: pnpm run test
      - name: build
        run: node scripts/build-wasm.mjs && npx tsc --noEmit && npx vite build
      - name: guards (file length + asset discipline)
        run: |
          node scripts/check-file-length.mjs
          node scripts/check-assets.mjs
