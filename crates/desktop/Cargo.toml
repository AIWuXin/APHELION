[package]
name = "oc-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "aphelion-desktop"
path = "src/main.rs"

[dependencies]
oc-launcher = { path = "../launcher" }
oc-protocol = { workspace = true }

# The native window is a Windows desktop deliverable. Keeping wry/tao behind a
# target gate lets the Linux CI runner lint and test the rest of the workspace
# without installing GTK/WebKitGTK development packages. On Windows these are
# the only third-party runtime dependencies; both require rustc 1.85, below the
# workspace MSRV, so no per-package rust-version override is needed.
[target.'cfg(windows)'.dependencies]
tao = "=0.37.1"
wry = "=0.57.0"

[build-dependencies]
embed-resource = "=3.0.12"
